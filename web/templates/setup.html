{{define "authcontent"}}
<h1>Welcome</h1>
<p class="label">Create the administrator account to secure this gateway. There are no default credentials.</p>
{{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
<form method="post" action="/setup" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>Username
    <input type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus required>
  </label>
  <label>Password <span class="label">(min. 10 characters)</span>
    <input type="password" name="password" autocomplete="new-password" required>
  </label>
  <label>Confirm password
    <input type="password" name="confirm" autocomplete="new-password" required>
  </label>
  <button type="submit" class="btn btn--primary">Create account</button>
</form>
{{end}}
