# Torizon Gateway — Torizon application definition.
# Deployed as a Torizon app; bake into the OS image via TorizonCore Builder so
# it's present on first boot. See docs/ARCHITECTURE.md §5 (privilege model) & §13.
#
# ⚠ Privilege model: NO blanket --privileged. Only the specific mounts below.
#   The Docker socket is root-equivalent on the host — see the "socket proxy"
#   backlog item before GA.

services:
  gateway-manager:
    image: ${REGISTRY:-torizon}/gateway-manager:${TAG:-latest}
    container_name: torizon-gateway
    restart: unless-stopped
    # Host networking: required to see host interfaces such as CAN (can0/can1)
    # in /sys/class/net, and it lets the self-signed cert auto-detect the real
    # LAN IP. The app binds :8443 directly on the host (no port mapping).
    network_mode: host
    environment:
      - GATEWAY_DATA_DIR=/data
      - GATEWAY_HOSTNAME=zinnia
      # Where the host filesystem "/" is visible in the container (for the host
      # mount table, statfs of mountpoints, and — later — the file explorer).
      - GATEWAY_HOST_ROOT=/host
      # Extra TLS SANs (only needed for a bridged container that can't see the
      # host IP; host networking auto-detects it). Delete data/tls/* to regen.
      # - GATEWAY_TLS_SANS=192.168.1.50,gateway.lan
    volumes:
      # Container management (Docker engine). Root-equivalent — see backlog.
      - /var/run/docker.sock:/var/run/docker.sock
      # Network configuration (NetworkManager over system D-Bus).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # Host filesystem (read-only): device-tree/os-release, the mount table
      # (/host/proc/1/mountinfo) and partition usage. The file explorer will add
      # rw access to /etc and /var specifically. Recursive bind includes submounts.
      - /:/host:ro
      # App-owned persistent state (SQLite DB, TLS cert).
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-manager", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
