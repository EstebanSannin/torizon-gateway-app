{{define "authcontent"}}
<h1>Sign in</h1>
<p class="muted" style="margin:0">Manage this Torizon device.</p>
{{if .Error}}<p class="form-error" style="margin-top:16px">{{.Error}}</p>{{end}}
<form method="post" action="/login" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <div class="field">
    <label>Username</label>
    <input type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus required>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn btn--primary">Sign in</button>
</form>
{{end}}
