{{define "base"}}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    // Apply the saved theme before first paint (no flash). Default: light.
    (function(){try{var t=localStorage.getItem('gw-theme');
      if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    function gwToggleTheme(){var r=document.documentElement;
      var next=r.getAttribute('data-theme')==='dark'?'light':'dark';
      r.setAttribute('data-theme',next);
      try{localStorage.setItem('gw-theme',next);}catch(e){}
      gwThemeIcon(next);}
    function gwThemeIcon(t){var b=document.getElementById('theme-toggle');if(!b)return;
      b.querySelector('.i-sun').style.display=t==='dark'?'none':'';
      b.querySelector('.i-moon').style.display=t==='dark'?'':'none';
      b.title=t==='dark'?'Switch to light mode':'Switch to dark mode';}
    document.addEventListener('DOMContentLoaded',function(){
      gwThemeIcon(document.documentElement.getAttribute('data-theme')||'light');});
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Torizon Gateway</title>
  <link rel="icon" href="/static/brand/torizon-avatar.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/htmx-ext-sse.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/brand/torizon-gateway-logo-dark.svg" alt="Torizon Gateway">
      </div>
      <div class="nav-label">Manage</div>
      <nav>
        <a href="/" class="{{if eq .Nav "dashboard"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Dashboard
        </a>
        <a href="/network" class="{{if eq .Nav "network"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
          Network
        </a>
        <a href="/containers" class="{{if eq .Nav "containers"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
          Containers
        </a>
        <a href="/cloud" class="{{if eq .Nav "cloud"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18a4 4 0 01-.5-7.97A5.5 5.5 0 0117.5 9.5 4 4 0 0117 18z"/></svg>
          Torizon Cloud
        </a>
        <a href="/updates" class="{{if eq .Nav "updates"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          Updates
        </a>
      </nav>
      <div class="nav-label">Diagnostics</div>
      <nav>
        <a href="/logs" class="{{if eq .Nav "logs"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 9h16M4 13h10M4 17h13"/></svg>
          Logs
        </a>
        <a href="/files" class="{{if eq .Nav "files"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          Files
        </a>
        <a href="/terminal" class="{{if eq .Nav "terminal"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
          Terminal
        </a>
        <a href="/gpio" class="{{if eq .Nav "gpio"}}active{{end}}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
          GPIO
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="avatar">{{if .User}}{{slice .User 0 1}}{{else}}·{{end}}</div>
        <div class="who">
          <div class="name">{{.User}}</div>
          <div class="role">Administrator</div>
        </div>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{.CSRF}}">
          <button type="submit" class="icon-btn" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 12H4m0 0l4-4m-4 4l4 4"/><path d="M10 4h8a2 2 0 012 2v12a2 2 0 01-2 2h-8"/></svg>
          </button>
        </form>
      </div>
    </aside>
    <main class="content">
      <div class="topbar">
        <h1>{{.Title}}</h1>
        <div class="topbar-right">
          <button id="theme-toggle" class="theme-btn" type="button" onclick="gwToggleTheme()" title="Switch to dark mode" aria-label="Toggle theme">
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          </button>
          <span class="device-chip" title="{{.Device}} — online"><span class="dot"></span><span class="device-name">{{.Device}}</span></span>
        </div>
      </div>
      {{template "content" .}}
    </main>
  </div>
</body>
</html>{{end}}
