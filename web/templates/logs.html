{{define "content"}}
<div class="page-header">
  <p class="muted" style="margin:0">Streaming stdout / stderr for <code>{{.ID}}</code> — last 200 lines, then live.</p>
  <a class="btn btn--ghost btn--sm" href="/containers">← Back to containers</a>
</div>

<pre id="logs" class="logbox"
     hx-ext="sse"
     sse-connect="/sse/logs/{{.ID}}"
     sse-swap="line"
     hx-swap="beforeend scroll:bottom"></pre>
{{end}}
