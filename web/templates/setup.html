{{define "authcontent"}}
<h1>Welcome</h1>
<p class="muted" style="margin:0">Create the administrator account to secure this gateway. There are no default credentials.</p>
{{if .Error}}<p class="form-error" style="margin-top:16px">{{.Error}}</p>{{end}}
<form method="post" action="/setup" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <div class="field">
    <label>Username</label>
    <input type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus required>
  </div>
  <div class="field">
    <label>Password <span class="hint">· min. 10 characters</span></label>
    <input type="password" name="password" autocomplete="new-password" required>
  </div>
  <div class="field">
    <label>Confirm password</label>
    <input type="password" name="confirm" autocomplete="new-password" required>
  </div>
  <button type="submit" class="btn btn--primary">Create account</button>
</form>
{{end}}
