{{define "content"}}
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">

<div id="connbar" class="card" style="margin-bottom:14px">
  <form id="connform" class="auth-form" style="flex-direction:row; align-items:end; gap:14px; margin:0; flex-wrap:wrap">
    <div class="field" style="min-width:180px"><label>Username</label><input type="text" name="user" value="torizon" autocomplete="username"></div>
    <div class="field" style="min-width:200px"><label>Password</label><input type="password" name="password" autocomplete="current-password"></div>
    <button type="submit" class="btn btn--primary">Connect</button>
    <span class="muted" style="font-size:0.8rem; padding-bottom:10px">SSH to the device (localhost). Session is audited.</span>
  </form>
</div>

<div id="term" style="height:66vh; border-radius:12px; overflow:hidden; background:#04182E; padding:8px"></div>

<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.js"></script>
<script>
(function () {
  var term = new Terminal({
    cursorBlink: true, fontSize: 13,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
    theme: { background: '#04182E', foreground: '#CFE3F7' }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();
  var ws = null;

  function connect(user, password) {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws/terminal');
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      ws.send(JSON.stringify({ user: user, password: password, cols: term.cols, rows: term.rows }));
      term.focus();
    };
    ws.onmessage = function (e) {
      if (typeof e.data === 'string') term.write(e.data);
      else term.write(new Uint8Array(e.data));
    };
    ws.onclose = function () { term.write('\r\n\x1b[90m*** disconnected ***\x1b[0m\r\n'); };
    term.onData(function (d) {
      if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d));
    });
    window.addEventListener('resize', function () {
      fit.fit();
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    });
  }

  document.getElementById('connform').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = this.user.value, p = this.password.value;
    document.getElementById('connbar').style.display = 'none';
    fit.fit();
    connect(u, p);
  });
})();
</script>
{{end}}
