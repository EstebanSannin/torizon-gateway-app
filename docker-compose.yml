# Torizon Gateway — official deployment.
#
# Deploy on ANY Torizon OS device (the image is multi-arch: arm64, arm/v7, amd64):
#   • Torizon Cloud: add this docker-compose.yml as a package, then deploy it to
#     your device(s) / fleet from the platform.
#   • Manually on a device:  docker compose up -d
#
# Torizon runs a single managed compose project, so this IS the device's app.
#
# Privilege model: NO blanket --privileged — only the specific host access the
# features need. The Docker socket is root-equivalent, so treat this as an admin
# console and expose it only on trusted networks. See docs/ARCHITECTURE.md §5.

services:
  gateway-manager:
    image: samnite/torizon-gateway:0.1.1   # or :latest for the rolling build
    container_name: torizon-gateway
    restart: unless-stopped

    # Runs as root. This container already mounts the Docker socket and the system
    # D-Bus (both root-equivalent on the host), and NetworkManager writes (IPv4 /
    # Wi-Fi) are authorized by polkit for root — so root is required for full
    # function and adds no meaningful risk over what the mounts already grant. It
    # also lets the app create its state dir on a fresh /data volume, and read the
    # journal + Docker socket without device-specific group GIDs.
    user: "0:0"

    # Host networking: required to see host interfaces (CAN, Wi-Fi) under
    # /sys/class/net and to let the self-signed cert auto-detect the LAN IP.
    # The app binds :8443 directly on the host (open https://<device-ip>:8443).
    network_mode: host

    environment:
      - GATEWAY_DATA_DIR=/data
      - GATEWAY_HOST_ROOT=/host          # where the host "/" is visible in-container
      - GATEWAY_HOSTNAME=torizon-gateway # cert SAN / display name; set to taste
      # --- Optional power features (OFF by default) ---
      # File edit/upload/delete confined to /etc,/var (secrets blocked). Enable
      # this AND the two rw mounts below.
      # - GATEWAY_FILES_WRITABLE=1
      # In-browser SSH terminal (127.0.0.1:22; user supplies board creds; audited).
      # - GATEWAY_TERMINAL_ENABLED=1
      # Extra TLS SANs if the host IP isn't auto-detected (delete data/tls/* to regen).
      # - GATEWAY_TLS_SANS=192.168.1.50,gateway.lan

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock               # container mgmt
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket # NetworkManager
      - /:/host:ro                                              # host FS (read-only)
      # Enable these two (with GATEWAY_FILES_WRITABLE=1 + user "0:0") for file writes:
      # - /etc:/host/etc:rw
      # - /var:/host/var:rw
      - gateway-data:/data                                      # SQLite DB + TLS cert

    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway-manager", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
